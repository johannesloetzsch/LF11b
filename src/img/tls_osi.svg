<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760">
  <style>
    .layer {
      fill: #d97979;
      fill-opacity: 0.12;
      stroke: #b45b5b;
      stroke-width: 2;
      stroke-dasharray: 8 7;
      rx: 12;
    }
    .label {
      font: 26px Arial, sans-serif;
      fill: #222;
    }
    .number {
      font: 24px Arial, sans-serif;
      font-weight: bold;
      fill: #555;
    }
    .tls {
      fill: #f4f8f2;
      stroke: #4c7855;
      stroke-width: 2.5;
      rx: 12;
    }
    .tls-label {
      font: 27px Arial, sans-serif;
      fill: #4c7855;
      letter-spacing: 4px;
    }
  </style>

  <rect class="layer" x="100" y="55" width="440" height="78"/>
  <text class="number" x="130" y="103">7.</text>
  <text class="label" x="185" y="103">Application</text>

  <rect class="layer" x="100" y="145" width="440" height="78"/>
  <text class="number" x="130" y="193">6.</text>
  <text class="label" x="185" y="193">Presentation</text>

  <rect class="layer" x="100" y="235" width="440" height="78"/>
  <text class="number" x="130" y="283">5.</text>
  <text class="label" x="185" y="283">Session</text>

  <rect class="tls" x="100" y="326" width="440" height="68"/>
  <text class="tls-label" x="320" y="370" text-anchor="middle">TLS</text>

  <rect class="layer" x="100" y="405" width="440" height="78"/>
  <text class="number" x="130" y="453">4.</text>
  <text class="label" x="185" y="453">Transport</text>

  <rect class="layer" x="100" y="495" width="440" height="78"/>
  <text class="number" x="130" y="543">3.</text>
  <text class="label" x="185" y="543">Network</text>

  <rect class="layer" x="100" y="585" width="440" height="78"/>
  <text class="number" x="130" y="633">2.</text>
  <text class="label" x="185" y="633">Data Link</text>

  <rect class="layer" x="100" y="675" width="440" height="62"/>
  <text class="number" x="130" y="714">1.</text>
  <text class="label" x="185" y="714">Physical</text>
</svg>

