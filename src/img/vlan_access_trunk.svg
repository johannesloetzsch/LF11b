<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" role="img" aria-labelledby="title desc">
  <title id="title">VLAN: Access-Ports und Trunk-Ports</title>
  <desc id="desc">Vier VLANs als Farben: Büro, Werkstatt, VoIP und Management. Access-Ports führen jeweils eine Farbe zum Endgerät. Trunks zwischen Switches und zum Router tragen alle vier Farben parallel.</desc>

